_BASE_: "mask2former_R50_plug.yaml"

# Geometry-aware: Boundary-aware Geo.Loss（训练时启用）
MODEL:
  MASK_FORMER:
    # 开启 GeoLoss（>0 才会在 criterion 里计算 loss_geo）
    GEOLOSS_WEIGHT: 1.0
    # 边界带宽度：按图像对角线比例换算
    GEOLOSS_BAND_DILATION_RATIO: 0.02
    # 边界带加权系数：weight = 1 + alpha * band
    GEOLOSS_BAND_ALPHA: 2.0

