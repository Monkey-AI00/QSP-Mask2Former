_BASE_: "mask2former_R50_plug_qsp.yaml"

MODEL:
  MASK_FORMER:
    # Enable the newly generated 4-template prior bank for QSP.
    PRIOR_PATH: "/home/user/sjw/Yolo_pointrend/detectron2/plug_canonical_prior.npy"
    PRIOR_USE_BANK: True
    PRIOR_BANK_SIZE: 4

INPUT:
  DATASET_MAPPER_NAME: "plug_qsp_instance"
  QSP_AUG:
    ENABLED: True

    # High-light breakage augmentation
    HIGHLIGHT_PROB: 0.5
    HIGHLIGHT_BAND_WIDTH: 5
    HIGHLIGHT_SPOT_MIN: 1
    HIGHLIGHT_SPOT_MAX: 3
    HIGHLIGHT_SIGMA_MIN: 15
    HIGHLIGHT_SIGMA_MAX: 45
    HIGHLIGHT_INTENSITY_MIN: 120.0
    HIGHLIGHT_INTENSITY_MAX: 220.0
    BOUNDARY_WASH_PROB: 0.7
    BOUNDARY_WASH_ALPHA_MIN: 0.3
    BOUNDARY_WASH_ALPHA_MAX: 0.8
    SATURATION_REDUCE_MIN: 0.2
    SATURATION_REDUCE_MAX: 0.6

    # Thick cable/coil occlusion augmentation
    WIRE_OCC_PROB: 0.5
    WIRE_NUM_MIN: 2
    WIRE_NUM_MAX: 4
    WIRE_THICKNESS_MIN: 22
    WIRE_THICKNESS_MAX: 42
    WIRE_CTRL_PTS_MIN: 4
    WIRE_CTRL_PTS_MAX: 6
    WIRE_PAD_X: 80
    WIRE_PAD_Y: 45
    WIRE_BRIGHTNESS_MIN: 190.0
    WIRE_BRIGHTNESS_MAX: 250.0

