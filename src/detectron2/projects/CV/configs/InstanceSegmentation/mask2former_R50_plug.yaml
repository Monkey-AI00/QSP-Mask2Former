_BASE_: "../../../../../../../Mask2Former/configs/coco/instance-segmentation/maskformer2_R50_bs16_50ep.yaml"

# plug: 1 类（最终以脚本 register_plug_dataset 读到的 thing_classes 长度为准）
MODEL:
  SEM_SEG_HEAD:
    NUM_CLASSES: 1

# 训练超参建议：
# - Mask2Former 默认是 8 卡 bs16 的配置，单卡必须改小
# - 下面给一个“能跑起来”的起点，建议再按显存/速度调参
SOLVER:
  IMS_PER_BATCH: 1
  BASE_LR: 0.0001
  MAX_ITER: 3000
  STEPS: (2100, 2700)

# 8GB 显存建议先降一点输入尺度（可按需要再改回 1024）
INPUT:
  IMAGE_SIZE: 800
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0

# 数据集名称会在训练脚本里覆盖，这里只是占位
DATASETS:
  TRAIN: ("plug_train1",)
  TEST: ("plug_train1",)


