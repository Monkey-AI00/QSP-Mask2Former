_BASE_: "../../../../../../../Mask2Former/configs/coco/instance-segmentation/swin/maskformer2_swin_large_IN21k_384_bs16_100ep.yaml"

# plug: 1 类（最终以脚本 register_plug_dataset 读到的 thing_classes 长度为准）
MODEL:
  SEM_SEG_HEAD:
    NUM_CLASSES: 1
  MASK_FORMER:
    # Plug 单实例任务不需要 200 queries；降到 100 更稳也更省显存。
    NUM_OBJECT_QUERIES: 100

# 40G 显存服务器起步超参（建议在训练命令里按实际吞吐再覆盖）
SOLVER:
  IMS_PER_BATCH: 2
  BASE_LR: 0.0001
  MAX_ITER: 6000
  STEPS: (3600, 5200)

INPUT:
  IMAGE_SIZE: 1024
  MIN_SCALE: 0.1
  MAX_SCALE: 2.0

# 占位：训练/评测脚本会覆盖
DATASETS:
  TRAIN: ("plug_train_merged",)
  TEST: ("plug_train_merged",)
