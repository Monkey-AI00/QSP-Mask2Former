_BASE_: "../../../../configs/COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml"
MODEL:
  # 你也可以在命令行用 --weights 覆盖
  # 推荐使用 COCO 预训练 Mask R-CNN 作为初始化：
  # detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl
  ROI_HEADS:
    # plug=1 类（实际以脚本 register_plug_dataset 读出的 thing_classes 长度为准）
    NUM_CLASSES: 1
    SCORE_THRESH_TEST: 0.5

# ============================================================
# 与 PointRend plug 训练配置对齐（pointrend_rcnn_R_50_FPN_3x_plug.yaml）
# - batch size: SOLVER.IMS_PER_BATCH
# - learning rate: SOLVER.BASE_LR
# - iterations: SOLVER.MAX_ITER / SOLVER.STEPS
# ============================================================
SOLVER:
  IMS_PER_BATCH: 6
  BASE_LR: 0.00025
  STEPS: (7000, 9000)
  MAX_ITER: 10000

# 输入尺寸对齐（可选；Base-RCNN-FPN.yaml 默认一致，这里显式写出便于对照）
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333


