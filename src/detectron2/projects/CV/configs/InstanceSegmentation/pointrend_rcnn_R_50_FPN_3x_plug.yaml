# PointRend 配置 - 用于 plug 数据集训练
# 基于 COCO 配置，适配自定义数据集

_BASE_: Base-PointRend-RCNN-FPN.yaml

MODEL:
  WEIGHTS: detectron2://ImageNetPretrained/MSRA/R-50.pkl  # ImageNet 预训练权重
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NUM_CLASSES: 1  # 只有 plug 类别（不包括背景）
    SCORE_THRESH_TEST: 0.5
  POINT_HEAD:
    NUM_CLASSES: 1  # PointRend 的 Point Head 类别数（必须与 ROI_HEADS.NUM_CLASSES 一致）

# 数据集配置（会在训练脚本中设置）
DATASETS:
  TRAIN: ("plug_train",)
  TEST: ("plug_train",)

# 训练配置
SOLVER:
  IMS_PER_BATCH: 6  # 40G 显存推荐值：4-8（当前设置为 6，可根据实际情况调整）
  # 显存使用建议：
  # - 40G 显存（A100）：推荐 4-8，当前设置为 6
  # - 如果遇到 OOM 错误，可以减小到 4
  # - 如果显存使用率 < 60%，可以尝试增加到 8
  BASE_LR: 0.00025  # 学习率
  STEPS: (7000, 9000)  # 学习率衰减步数
  MAX_ITER: 10000  # 最大迭代次数
  # 对于小数据集，可以适当减少迭代次数，例如:
  # MAX_ITER: 10000
  # STEPS: (7000, 9000)

# 输入配置
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)  # 训练时图片最短边
  MAX_SIZE_TRAIN: 1333  # 训练时图片最长边
  MIN_SIZE_TEST: 800  # 测试时图片最短边
  MAX_SIZE_TEST: 1333  # 测试时图片最长边

# 输出配置
OUTPUT_DIR: "./output/plug_pointrend"

